name: Student Task Manager E2E Test & Allure CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  e2e-tests:
    name: Run Playwright Tests & Generate Reports
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17 (Required by Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install Playwright Chromium with System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        id: run-tests
        run: npm test

      - name: Generate Allure Static HTML Report
        if: always()
        run: npm run allure:generate

      - name: Upload Playwright HTML Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure Static HTML Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload Allure Raw Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14

      - name: Upload Failure Screenshots & Traces (if any)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-failure-results
          path: test-results/
          retention-days: 14
